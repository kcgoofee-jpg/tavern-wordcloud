# Every push and PR: typecheck, lint, tests, build.
#
# deploy.yml and mirror.yml both run on `workflow_run: [ci]`, so skipping ci here skips
# the deploy too. That is the point: a push that only edits the private notes or the board
# used to rebuild the image and restart the live container for nothing (2026-09-06).
#
# Only paths that reach neither the build nor the public mirror belong in the ignore list.
# `docs/**` is deliberately NOT ignored — the manual ships to the public mirror, so it still
# has to run the chain. Same for `.github/**`, which is how this rule itself gets verified.
name: ci
on:
  push:
    branches: [main]
    paths-ignore: ['notes/**', 'TODO.md', 'STATUS.md', 'AGENTS.md', 'PROGRESS.md', 'CLAUDE.md']
  pull_request:
    paths-ignore: ['notes/**', 'TODO.md', 'STATUS.md', 'AGENTS.md', 'PROGRESS.md', 'CLAUDE.md']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vite-node --version   # warm the server-test runner; the first spawn otherwise pays the cold start inside a test timeout
      - run: npm run fixtures   # 生成合成语料（fixtures/ 不入库），让语料相关测试真的跑而不是跳过
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:single   # before the tests: server tests serve dist-single/index.html (not tracked)
      - run: npm test
  # The full layout audit, both languages, desktop and phone. deploy.yml waits for this
  # workflow to succeed, so a layout regression now blocks the deploy instead of relying on
  # whoever pushed having run `npm run audit` by hand (2026-09-08). Screenshots are kept
  # only when it fails — that is when someone needs to look at them.
  #
  # One job per viewport (2026-09-09). Inside a job the two languages already ran side by side,
  # but the viewports ran one after another, so a single job's wall clock was the sum of all
  # three (~9 min). Fanning them out costs three checkouts, three `npm ci` and three builds and
  # buys back the serial part. deploy.yml and mirror.yml key on `workflow_run` with
  # `conclusion == 'success'`, which is the conclusion of the WHOLE workflow — every matrix job
  # included — so all three still have to be green before anything ships; neither file changes.
  #
  # `fail-fast: false`: one viewport failing must not cancel the other two, or their screenshots
  # never get uploaded and the report says nothing about the viewports nobody looked at.
  # The artifact name carries the viewport, or the three jobs would fight over one name.
  # The viewport list is pinned against tools/audit.mjs by test/ci-audit-matrix.test.ts.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        viewport: ['1440x900', '1024x768', '390x844']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run fixtures
      - run: npm run build:single
      - run: AUDIT_VIEWPORTS=${{ matrix.viewport }} SHOT_NO_BUILD=1 SHOT_CHROME=google-chrome node tools/audit.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: audit-screenshots-${{ matrix.viewport }}
          path: /tmp/shot-*
          retention-days: 7
